<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020805; }
      #root-ra { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #020805; }
      #scene-canvas-ra { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #glow-canvas-ra { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #labels-ra { position: absolute; inset: 0; pointer-events: none; }
      .node-label {
        position: absolute; transform: translate(-50%, -50%);
        font-family: "Space Mono", monospace; font-weight: 700; font-size: 16px;
        letter-spacing: 0.08em; text-transform: uppercase; color: #a9ffc4;
        text-shadow: 0 0 10px rgba(57,255,106,0.8), 0 0 2px #020805;
        white-space: nowrap;
      }
      .node-label.ceo { font-size: 20px; color: #eafff0; }
      #scanbar-ra {
        position: absolute; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, transparent, rgba(57,255,106,0.9), transparent);
        box-shadow: 0 0 24px 6px rgba(57,255,106,0.55);
        pointer-events: none;
      }
      #scan-ra {
        position: absolute; inset: -20px;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.35) 0 1px, transparent 1px 3px);
        pointer-events: none;
      }
      #grid-tex-ra {
        position: absolute; inset: 0;
        background:
          repeating-linear-gradient(0deg, rgba(57,255,106,0.05) 0 1px, transparent 1px 28px),
          repeating-linear-gradient(90deg, rgba(57,255,106,0.05) 0 1px, transparent 1px 28px);
        pointer-events: none;
      }
      #vignette-ra {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.65) 100%);
      }
      #caption-ra {
        position: absolute; left: 96px; bottom: 90px;
        font-family: "Space Mono", monospace; font-weight: 700; font-size: 34px;
        letter-spacing: 0.1em; text-transform: uppercase; color: #39ff6a; opacity: 0;
        text-shadow: 0 0 18px rgba(57,255,106,0.55);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-07sg"
      id="root-ra"
      data-composition-id="red-agentes-3d"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <canvas data-hf-id="hf-hibr" id="scene-canvas-ra" class="clip" data-start="0" data-duration="6" data-track-index="1"></canvas>
      <canvas data-hf-id="hf-83b5" id="glow-canvas-ra" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-allow-overflow></canvas>
      <div data-hf-id="hf-ovsc" id="grid-tex-ra" data-layout-allow-overflow></div>
      <div data-hf-id="hf-4683" id="scan-ra" data-layout-allow-overflow></div>
      <div data-hf-id="hf-rkvi" id="scanbar-ra" class="clip" data-start="0" data-duration="6" data-track-index="2" data-layout-allow-overflow data-layout-ignore></div>
      <div data-hf-id="hf-eech" id="labels-ra" class="clip" data-start="0" data-duration="6" data-track-index="2" data-layout-allow-overflow data-layout-ignore></div>
      <div data-hf-id="hf-5mi6" id="vignette-ra" data-layout-allow-overflow></div>
      <div data-hf-id="hf-5ftb" id="caption-ra" class="clip" data-start="3.6" data-duration="2.4" data-hold="true">VeridisCorp — red de agentes</div>

      <div data-hf-id="hf-sto4" id="s-hud" data-composition-id="hud" data-composition-src="compositions/components/telemetry-hud.html"
           data-start="0" data-duration="6" data-track-index="3" style="--bg: transparent"
           data-variable-values='{"readouts":"estado:mapeando,nodos:9,enlaces:8,revisor:activo","emphasize":0,"accent":"green","exit":"none"}'></div>
    </div>

    <script>
      (function () {
        var root = document.getElementById("root-ra");
        var duration = Math.max(0.001, parseFloat(root.dataset.duration) || 6);
        var clock = { t: 0 };
        var scene = { duration: duration, clock: clock, render: null };
        window.__red3d = scene;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["red-agentes-3d"] = new Promise(function (resolve) { scene.ready = resolve; });

        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration, duration: duration, ease: "none",
          onUpdate: function () { if (scene.render) scene.render(clock.t); },
        }, 0);
        tl.fromTo("#caption-ra", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["red-agentes-3d"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";

      const host = window.__red3d;
      const GREEN = new THREE.Color(0x39ff6a);
      const WHITE_GREEN = new THREE.Color(0xeafff0);

      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("scene-canvas-ra"),
        antialias: true, alpha: true, preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;

      // Cheap, deterministic bloom (same technique as the other 3D scenes in
      // this series): draw a blurred, brightened copy of the just-rendered
      // canvas on top with additive blending — a 2D composite, not a shader
      // pass, and still a pure function of t.
      const glowCanvas = document.getElementById("glow-canvas-ra");
      glowCanvas.width = 1920;
      glowCanvas.height = 1080;
      const glowCtx = glowCanvas.getContext("2d");

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.1, 100);

      const grid = new THREE.GridHelper(8, 32, 0x39ff6a, 0x166534);
      grid.material.transparent = true;
      grid.material.opacity = 0.25;
      grid.position.y = -1.3;
      scene.add(grid);

      // VeridisCorp's real org chart (docs/company-organization.md): the
      // CEO and its 8 direct department-head reports. Fully procedural —
      // an abstract node/line network, no 3D model, so no licensing
      // question at all (per the "forma abstracta se arma a mano" guidance
      // in agents/video-production/knowledge/hyperframes-elementos-3d.md).
      const CEO = { id: "ceo", label: "CEO" };
      const REPORTS = [
        { id: "cfo", label: "CFO" },
        { id: "cto", label: "CTO" },
        { id: "coo", label: "COO" },
        { id: "pm", label: "PM" },
        { id: "cmo", label: "CMO" },
        { id: "hr", label: "RH" },
        { id: "research-lead", label: "I+D" },
        { id: "quality-lead", label: "CALIDAD" },
      ];

      const RING_RADIUS = 2.1;
      const nodes = [{ ...CEO, position: new THREE.Vector3(0, 0.15, 0), isCeo: true }];
      REPORTS.forEach((r, i) => {
        const angle = (i / REPORTS.length) * Math.PI * 2;
        const yWobble = Math.sin(i * 1.7) * 0.32;
        nodes.push({
          ...r,
          position: new THREE.Vector3(Math.sin(angle) * RING_RADIUS, 0.15 + yWobble, Math.cos(angle) * RING_RADIUS),
          isCeo: false,
        });
      });

      const nodeWireMat = new THREE.MeshBasicMaterial({ color: GREEN, wireframe: true, transparent: true, opacity: 0.85 });
      const ceoWireMat = new THREE.MeshBasicMaterial({ color: WHITE_GREEN, wireframe: true, transparent: true, opacity: 0.95 });
      const nodeFillMat = new THREE.MeshBasicMaterial({ color: GREEN, transparent: true, opacity: 0.12, depthWrite: false });
      const ceoFillMat = new THREE.MeshBasicMaterial({ color: WHITE_GREEN, transparent: true, opacity: 0.2, depthWrite: false });

      nodes.forEach((n) => {
        const size = n.isCeo ? 0.3 : 0.2;
        const geo = new THREE.IcosahedronGeometry(size, 1);
        const wire = new THREE.Mesh(geo, n.isCeo ? ceoWireMat : nodeWireMat);
        wire.position.copy(n.position);
        scene.add(wire);
        const fill = new THREE.Mesh(geo, n.isCeo ? ceoFillMat : nodeFillMat);
        fill.position.copy(n.position);
        scene.add(fill);
        n.mesh = wire;
      });

      // Links: a LineSegments from the CEO to each report — the org chart's
      // real reporting lines, nothing invented or symmetric for its own sake.
      const linkPositions = [];
      REPORTS.forEach((_, i) => {
        const ceoNode = nodes[0];
        const reportNode = nodes[i + 1];
        linkPositions.push(ceoNode.position.x, ceoNode.position.y, ceoNode.position.z);
        linkPositions.push(reportNode.position.x, reportNode.position.y, reportNode.position.z);
      });
      const linkGeo = new THREE.BufferGeometry();
      linkGeo.setAttribute("position", new THREE.Float32BufferAttribute(linkPositions, 3));
      const linkMat = new THREE.LineBasicMaterial({ color: GREEN, transparent: true, opacity: 0.5 });
      const links = new THREE.LineSegments(linkGeo, linkMat);
      scene.add(links);

      // Label DOM elements, positioned every frame via camera projection —
      // a pure function of camera + node position at time t, so still
      // deterministic and seek-safe.
      const labelsEl = document.getElementById("labels-ra");
      nodes.forEach((n) => {
        const div = document.createElement("div");
        div.className = "node-label" + (n.isCeo ? " ceo" : "");
        div.textContent = n.label;
        labelsEl.appendChild(div);
        n.labelEl = div;
      });

      const scanbarEl = document.getElementById("scanbar-ra");
      const projected = new THREE.Vector3();

      host.render = (t) => {
        const p = t / host.duration;
        const angle = THREE.MathUtils.lerp(-0.4, 1.1, p);
        const dist = THREE.MathUtils.lerp(6.6, 5.6, Math.min(1, p * 1.2));
        camera.position.set(Math.sin(angle) * dist, 2.1, Math.cos(angle) * dist);
        camera.lookAt(0, -0.1, 0);

        // Gentle per-node pulse, each on its own deterministic phase offset
        // (index-based, not random) so nodes don't all breathe in lockstep.
        nodes.forEach((n, i) => {
          const pulse = 1 + Math.sin(t * 1.6 + i * 0.9) * 0.06;
          n.mesh.scale.setScalar(pulse);
        });

        renderer.render(scene, camera);

        glowCtx.clearRect(0, 0, 1920, 1080);
        glowCtx.filter = "blur(8px) brightness(1.7)";
        glowCtx.globalCompositeOperation = "lighter";
        glowCtx.drawImage(renderer.domElement, 0, 0);
        glowCtx.filter = "blur(20px) brightness(1.3)";
        glowCtx.globalAlpha = 0.55;
        glowCtx.drawImage(renderer.domElement, 0, 0);
        glowCtx.globalAlpha = 1;

        nodes.forEach((n) => {
          projected.copy(n.position).project(camera);
          const x = (projected.x * 0.5 + 0.5) * 1920;
          const y = (1 - (projected.y * 0.5 + 0.5)) * 1080;
          n.labelEl.style.left = x + "px";
          n.labelEl.style.top = (y - 32) + "px";
          n.labelEl.style.opacity = projected.z < 1 ? "1" : "0";
        });

        // Scan sweep: a sawtooth in [0,1) over a 1.6s period, pure function of t.
        const sweep = (t / 1.6) % 1;
        scanbarEl.style.top = (sweep * 1080) + "px";
      };
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
