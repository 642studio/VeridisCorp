<template>
  <style>
    #root {
      position: absolute; inset: 0; overflow: hidden; background: #020805;
      font-family: "Space Mono", monospace;
    }
    #grid {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px);
    }
    #stage { position: absolute; left: 0; right: 0; top: 820px; text-align: center; }
    .state { display: inline-flex; align-items: center; gap: 16px; margin: 0 auto 22px; width: 460px; text-align: left; }
    .state .dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(57,255,106,0.4);
      background: #06140a; flex: none; }
    .state.on .dot { border-color: #39ff6a; background: #39ff6a; box-shadow: 0 0 16px rgba(57,255,106,0.8); }
    .state .label { font-weight: 700; font-size: 32px; color: #6fae82; }
    .state.on .label { color: #eafff0; }
    #caption {
      position: absolute; left: 70px; right: 70px; top: 1560px;
      font-weight: 700; font-size: 40px; color: #39ff6a; text-align: center;
      text-shadow: 0 0 16px rgba(57,255,106,0.5); opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="estados" data-width="1080" data-height="1920">
    <div id="grid" data-layout-allow-overflow></div>
    <div id="stage">
      <div class="state" id="s1"><div class="dot"></div><div class="label">pending</div></div>
      <div class="state" id="s2"><div class="dot"></div><div class="label">running</div></div>
      <div class="state" id="s3"><div class="dot"></div><div class="label">in_review</div></div>
      <div class="state" id="s4"><div class="dot"></div><div class="label">completed</div></div>
    </div>
    <div id="caption">Un estado real, no una animación</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set("#stage", { scale: 1.8, opacity: 0 });
    tl.to("#stage", { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

    const ON_BORDER = "#39ff6a", ON_GLOW = "0 0 16px rgba(57,255,106,0.8)", ON_LABEL = "#eafff0";
    ["#s1", "#s2", "#s3", "#s4"].forEach((sel, i) => {
      const t = 0.5 + i * 1.0;
      tl.set(sel + " .dot", { borderColor: ON_BORDER, backgroundColor: ON_BORDER, boxShadow: ON_GLOW }, t);
      tl.set(sel + " .label", { color: ON_LABEL }, t);
    });

    tl.fromTo("#caption", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 3.5);
    tl.to("#caption", { opacity: 0, duration: 0.2, ease: "power2.in" }, 5.85);

    tl.to("#stage", { scale: 0.25, opacity: 0, duration: 0.3, ease: "power2.in" }, 6.1);

    window.__timelines = window.__timelines || {};
    window.__timelines["estados"] = tl;
  </script>
</template>
