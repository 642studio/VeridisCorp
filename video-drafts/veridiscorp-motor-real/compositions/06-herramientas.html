<template>
  <style>
    #root {
      position: absolute; inset: 0; overflow: hidden; background: #020805;
      font-family: "Space Mono", monospace;
    }
    #grid {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px);
    }
    #stage { position: absolute; left: 0; right: 0; top: 760px; text-align: center; }
    #num { font-weight: 800; font-size: 160px; color: #eafff0; text-shadow: 0 0 36px rgba(57,255,106,0.8); }
    #label { margin-top: 6px; font-weight: 700; font-size: 32px; color: #39ff6a; letter-spacing: 0.04em; }
    #tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 640px; margin: 28px auto 0; }
    .tile { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #06140a;
      border: 2px solid rgba(57,255,106,0.4); opacity: 0; }
    #caption {
      position: absolute; left: 70px; right: 70px; top: 1600px;
      font-weight: 700; font-size: 40px; color: #39ff6a; text-align: center;
      text-shadow: 0 0 16px rgba(57,255,106,0.5); opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="herramientas" data-width="1080" data-height="1920">
    <div id="grid" data-layout-allow-overflow></div>
    <div id="stage">
      <div id="num">17</div>
      <div id="label">HERRAMIENTAS CON EFECTO REAL</div>
      <div id="tiles"></div>
    </div>
    <div id="caption">Nada es un disfraz</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set("#stage", { scale: 1.8, opacity: 0 });
    tl.to("#stage", { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

    const tilesEl = document.getElementById("tiles");
    for (let i = 0; i < 17; i++) {
      const t = document.createElement("div");
      t.className = "tile";
      tilesEl.appendChild(t);
    }
    const tiles = tilesEl.querySelectorAll(".tile");
    tiles.forEach((el, i) => {
      tl.to(el, { opacity: 1, duration: 0.08, ease: "none" }, 0.4 + i * 0.06);
    });

    tl.fromTo("#caption", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 2.3);
    tl.to("#caption", { opacity: 0, duration: 0.2, ease: "power2.in" }, 4.2);

    tl.to("#stage", { scale: 0.25, opacity: 0, duration: 0.3, ease: "power2.in" }, 4.4);

    window.__timelines = window.__timelines || {};
    window.__timelines["herramientas"] = tl;
  </script>
</template>
