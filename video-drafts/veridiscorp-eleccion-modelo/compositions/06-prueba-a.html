<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #020805; font-family: "Space Mono", monospace; }
    #grid { position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px); }
    #title { position: absolute; left: 90px; right: 90px; top: 320px; font-weight: 800; font-size: 38px;
      color: #eafff0; text-align: center; }
    #card { position: absolute; left: 90px; right: 90px; top: 620px; background: #06140a; border: 2px solid #1f8a46;
      border-radius: 24px; padding: 48px 38px; text-align: center; }
    #num { font-weight: 800; font-size: 130px; color: #39ff6a; text-shadow: 0 0 24px rgba(57,255,106,0.6); }
    #label { margin-top: 10px; font-size: 30px; color: #eafff0; font-weight: 700; }
    #tag { margin-top: 24px; font-size: 28px; color: #9fe7b4; opacity: 0; }
  </style>
  <div id="root" data-composition-id="prueba-a" data-width="1080" data-height="1920">
    <div id="grid" data-layout-allow-overflow></div>
    <div id="title">Prueba real: la misma tarea</div>
    <div id="card">
      <div id="num">0</div>
      <div id="label">tokens de entrada</div>
      <div id="tag">Proveedor A (DeepSeek)</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set("#title", { opacity: 0.5, y: 8 });
    tl.to("#title", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0);
    gsap.set("#card", { opacity: 0.5, scale: 0.94 });
    tl.to("#card", { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 0.05);

    // Conteo determinista 0 -> 338 (sin Math.random/Date.now).
    const numEl = document.getElementById("num");
    const TARGET = 338, STEPS = 12, START = 0.15, STEP = 0.045;
    for (let i = 1; i <= STEPS; i++) {
      const v = Math.round((TARGET / STEPS) * i);
      tl.call(() => { numEl.textContent = v; }, [], START + i * STEP);
    }
    tl.to("#tag", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.95);

    tl.to("#card", { opacity: 0.9, duration: 0.65, repeat: 3, yoyo: true, ease: "sine.inOut" }, 1.8);

    window.__timelines = window.__timelines || {};
    window.__timelines["prueba-a"] = tl;
  </script>
</template>
