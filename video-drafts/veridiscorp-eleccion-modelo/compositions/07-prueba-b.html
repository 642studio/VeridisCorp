<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #020805; font-family: "Space Mono", monospace; }
    #grid { position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px); }
    #card { position: absolute; left: 90px; right: 90px; top: 460px; background: #06140a; border: 2px solid #1f8a46;
      border-radius: 24px; padding: 48px 38px; text-align: center; }
    #num { font-weight: 800; font-size: 130px; color: #39ff6a; text-shadow: 0 0 24px rgba(57,255,106,0.6); }
    #label { margin-top: 10px; font-size: 30px; color: #eafff0; font-weight: 700; }
    #tag { margin-top: 24px; font-size: 28px; color: #9fe7b4; }
    #caption { position: absolute; left: 90px; right: 90px; top: 1120px; text-align: center;
      font-size: 30px; font-weight: 700; color: #39ff6a; opacity: 0; }
  </style>
  <div id="root" data-composition-id="prueba-b" data-width="1080" data-height="1920">
    <div id="grid" data-layout-allow-overflow></div>
    <div id="card">
      <div id="num">0</div>
      <div id="label">tokens de entrada</div>
      <div id="tag">Proveedor B (OpenAI)</div>
    </div>
    <div id="caption">No es un benchmark — es lo que pasó esa vez.</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set("#card", { opacity: 0.5, scale: 0.94 });
    tl.to("#card", { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 0);

    const numEl = document.getElementById("num");
    const TARGET = 277, STEPS = 10, START = 0.1, STEP = 0.045;
    for (let i = 1; i <= STEPS; i++) {
      const v = Math.round((TARGET / STEPS) * i);
      tl.call(() => { numEl.textContent = v; }, [], START + i * STEP);
    }

    gsap.set("#caption", { y: 10 });
    tl.to("#caption", { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.0);

    window.__timelines = window.__timelines || {};
    window.__timelines["prueba-b"] = tl;
  </script>
