<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #020805; --fg: #39ff6a; --muted: #1f8a46; --border: #1f8a46;
        --surface: #06140a; --brand: #39ff6a; --font-mono: "Space Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #020805; }
    </style>
  </head>
  <body>
    <!--
      Video 5 del plan de 5: gancho de pregunta con input real tecleado en
      pantalla (device nunca probado en los 4 anteriores), resumiendo el
      flujo ya verificado (detecta/conecta/avanza/aprueba) en 4 cortes muy
      rápidos. 20.6s — la duración más corta del plan, porque el guion real
      (7 líneas, varias de 1-2 palabras) no da para más sin rellenar.
    -->
    <div id="root" data-composition-id="y-si" data-start="0" data-duration="20.6"
         data-width="1080" data-height="1920">

      <div id="s-hook" data-composition-id="hook" data-composition-src="compositions/01-hook.html"
           data-start="0" data-duration="3.6" data-track-index="1"></div>
      <div id="s-detecta" data-composition-id="detecta" data-composition-src="compositions/02-detecta.html"
           data-start="3.6" data-duration="2" data-track-index="1"></div>
      <div id="s-conecta" data-composition-id="conecta" data-composition-src="compositions/03-conecta.html"
           data-start="5.6" data-duration="2.3" data-track-index="1"></div>
      <div id="s-avanza" data-composition-id="avanza" data-composition-src="compositions/04-avanza.html"
           data-start="7.9" data-duration="2" data-track-index="1"></div>
      <div id="s-aprueba" data-composition-id="aprueba" data-composition-src="compositions/05-aprueba.html"
           data-start="9.9" data-duration="2.8" data-track-index="1"></div>
      <div id="s-completada" data-composition-id="completada" data-composition-src="compositions/06-completada.html"
           data-start="12.7" data-duration="2" data-track-index="1"></div>
      <div id="s-claim" data-composition-id="claim" data-composition-src="compositions/07-claim.html"
           data-start="14.7" data-duration="2.2" data-track-index="1"></div>
      <div id="s-endcard" data-composition-id="endcard" data-composition-src="compositions/08-endcard.html"
           data-start="16.9" data-duration="3.7" data-track-index="1"></div>

      <!-- Voz (ElevenLabs, ES) -->
      <audio id="voice-l1" class="clip" src="assets/voice/l1-hook.wav"
             data-start="1" data-duration="1.765" data-track-index="5" data-volume="1"></audio>
      <audio id="voice-l2" class="clip" src="assets/voice/l2-detecta.wav"
             data-start="3.8" data-duration="1.3" data-track-index="5" data-volume="1"></audio>
      <audio id="voice-l3" class="clip" src="assets/voice/l3-conecta.wav"
             data-start="5.8" data-duration="1.672" data-track-index="5" data-volume="1"></audio>
      <audio id="voice-l4" class="clip" src="assets/voice/l4-avanza.wav"
             data-start="8.1" data-duration="1.44" data-track-index="5" data-volume="1"></audio>
      <audio id="voice-l5" class="clip" src="assets/voice/l5-aprueba.wav"
             data-start="10.1" data-duration="2.183" data-track-index="5" data-volume="1"></audio>
      <audio id="voice-l6" class="clip" src="assets/voice/l6-completada.wav"
             data-start="12.9" data-duration="1.44" data-track-index="5" data-volume="1"></audio>
      <audio id="voice-l7" class="clip" src="assets/voice/l7-claim.wav"
             data-start="14.9" data-duration="1.486" data-track-index="5" data-volume="1"></audio>
      <audio id="voice-l8" class="clip" src="assets/voice/l8-cta.wav"
             data-start="17.3" data-duration="2.136" data-track-index="5" data-volume="1"></audio>

      <!-- SFX -->
      <audio id="sfx-beep" class="clip" src="assets/sfx/beep.mp3"
             data-start="3.8" data-duration="0.12" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sfx-whoosh" class="clip" src="assets/sfx/whoosh.mp3"
             data-start="5.8" data-duration="1.8" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sfx-click" class="clip" src="assets/sfx/click.mp3"
             data-start="10.4" data-duration="2.2" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sfx-chime" class="clip" src="assets/sfx/chime.mp3"
             data-start="12.9" data-duration="0.323" data-track-index="6" data-volume="0.35"></audio>

      <!-- Música (reusa el track de SunoAPI) -->
      <audio id="bgm-1" class="clip" src="assets/bgm/track.mp3"
             data-start="0" data-duration="20.6" data-track-index="7" data-volume="0.45"
             data-fade-out="1.2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["y-si"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
