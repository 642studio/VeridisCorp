<template>
  <style>
    #root {
      position: absolute; inset: 0; overflow: hidden; background: #020805;
      font-family: "Space Mono", monospace;
    }
    #grid {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, rgba(57,255,106,0.06) 0 1px, transparent 1px 28px);
    }
    #question {
      position: absolute; left: 90px; right: 90px; top: 600px;
      font-weight: 800; font-size: 56px; line-height: 1.3; color: #eafff0; text-align: center;
    }
    #question .accent { color: #39ff6a; text-shadow: 0 0 18px rgba(57,255,106,0.7); }
    #stage { position: absolute; left: 0; right: 0; top: 920px; text-align: center; }
    #panel {
      display: inline-block; background: #06140a; border: 2px solid #39ff6a; border-radius: 22px;
      padding: 36px 42px; box-shadow: 0 0 50px rgba(57,255,106,0.35); min-width: 640px;
    }
    #prompt { font-weight: 700; font-size: 32px; color: #9fe7b4; text-align: left; }
    #prompt .cursor { display: inline-block; width: 4px; height: 30px; background: #39ff6a;
      vertical-align: -6px; margin-left: 2px; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="grid" data-layout-allow-overflow></div>
    <div id="question">¿Y si tu empresa<br>corriera <span class="accent">así</span>?</div>
    <div id="stage">
      <div id="panel"><div id="prompt"><span id="typed"></span><span class="cursor"></span></div></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Ya parcialmente visible desde el frame 0 (nunca opacity:0 puro) — el
    // frame 0 es la miniatura en redes, nunca puede verse vacío.
    gsap.set("#question", { opacity: 0.5, y: 6 });
    tl.to("#question", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0);
    gsap.set("#stage", { opacity: 0.4, y: 6 });
    tl.to("#stage", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0.25);

    // Tecleo determinista, carácter por carácter (nunca Date.now/Math.random).
    const text = "cotizar 3 unidades a Acme";
    const el = document.getElementById("typed");
    const START = 0.45, STEP = 0.035;
    for (let i = 1; i <= text.length; i++) {
      tl.call(() => { el.textContent = text.slice(0, i); }, [], START + i * STEP);
    }
    tl.to(".cursor", { opacity: 0, duration: 0.25, repeat: 5, yoyo: true, ease: "none" }, START + text.length * STEP + 0.1);

    window.__timelines = window.__timelines || {};
    window.__timelines["hook"] = tl;
  </script>
</template>
